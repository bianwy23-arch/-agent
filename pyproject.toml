[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-agent-v1"
version = "0.1.0"
description = "Independent, evidence-based shopping agent"
requires-python = ">=3.11"
dependencies = [
  "openai-agents==0.22.1",
  "openai==3.10.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.scripts]
shopping-agent = "shopping_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
